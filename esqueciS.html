<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recuperar Senha | Ler e Educar</title>
  <link rel="stylesheet" href="css/design-system.css">
  <link rel="stylesheet" href="css/login.css">
</head>
<body>
  <div class="bg-parallax"></div>
  <canvas id="particles-canvas"></canvas>
  <a href="login.html" class="sair">← Voltar</a>

  <div class="login-box" style="text-align:center">
    <img src="img/logo-tela-de-cadastro.png" class="logo" alt="Logo">
    <h1>LER E EDUCAR</h1>

    <div style="font-size:3rem;margin:12px 0;animation:float 3s ease-in-out infinite">🔑</div>

    <h2 style="font-family:var(--font-display);font-size:1.15rem;color:var(--text-dark);margin-bottom:10px">
      Esqueceu sua senha?
    </h2>
    <p style="font-size:.88rem;color:var(--text-muted);line-height:1.65;margin-bottom:24px">
      A redefinição de senha é feita pelo <strong style="color:var(--text-dark)">administrador do sistema</strong>.<br>
      Entre em contato e informe o e-mail da sua conta para que a nova senha seja gerada.
    </p>

    <div style="background:var(--bg-warm);border:1px solid var(--beige);border-radius:var(--radius-lg);padding:16px 20px;margin-bottom:24px;text-align:left">
      <p style="font-size:.78rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--text-muted);margin-bottom:8px">Contato do Administrador</p>
      <p style="font-size:.88rem;color:var(--text-dark);display:flex;align-items:center;gap:8px">
        ✉️ <strong>admin@lereducar.com.br</strong>
      </p>
    </div>

    <a href="login.html" class="btn-login" style="display:block;text-align:center;text-decoration:none;padding:13px">
      ← Voltar para o login
    </a>
  </div>

  <script src="js/api.js"></script>
  <script src="js/animations.js"></script>
  <script>
    initAnimations({ tilt:false, stagger:false, hamburguer:false, headerScroll:false });
    initParticles(); initParallax('.bg-parallax', 15);
  </script>
</body>
</html>
