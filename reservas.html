<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Minhas Reservas - Ler e Educar</title>
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/reservas.css">
  <style>
    .badge-pendente  { background:#f39c12;color:#fff;padding:2px 8px;border-radius:12px;font-size:.8rem; }
    .badge-ativa     { background:#27ae60;color:#fff;padding:2px 8px;border-radius:12px;font-size:.8rem; }
    .badge-devolvido { background:#7f8c8d;color:#fff;padding:2px 8px;border-radius:12px;font-size:.8rem; }
    .sem-dados       { color:#888;font-style:italic;padding:12px 0; }
  </style>
</head>
<body>
  <header class="header">
    <div class="menu-hamburguer" onclick="toggleMenu()"><span></span><span></span><span></span></div>
    <div class="logo-header">
      <img src="img/logo-capa-e-barra-de-pesquisa.png" alt="Logo" class="logo-img">
      <span class="logo-text">LER E EDUCAR</span>
    </div>
    <input type="text" placeholder="Buscar livro..." class="busca">
    <div class="header-direita">
      <div class="usuario">Olá, <span id="nome-usuario-logado">Gestor</span></div>
      <a href="#" class="sair" onclick="Auth.logout()">SAIR</a>
    </div>
  </header>

  <nav id="menu-lateral" class="menu-lateral">
    <div class="fechar-menu" onclick="toggleMenu()">✕</div>
    <a href="catalogo.html"       class="menu-item">CATÁLOGO</a>
    <a href="perfil-usuario.html" class="menu-item">MEU PERFIL</a>
    <a href="reservas.html"       class="menu-item ativo">MINHAS RESERVAS</a>
    <a href="devolutivas.html"    class="menu-item">DEVOLUÇÕES</a>
  </nav>

  <main class="reservas-bg fundo-canva">
    <div class="reservas-container">
      <h1 class="reservas-titulo">MINHAS RESERVAS</h1>

      <section class="bloco-reserva">
        <h2>SOLICITAÇÕES:</h2>
        <div id="lista-pendentes"><p class="sem-dados">Carregando...</p></div>
      </section>

      <section class="bloco-reserva">
        <h2>RESERVAS:</h2>
        <div id="lista-ativas"><p class="sem-dados">Carregando...</p></div>
      </section>
    </div>
  </main>

  <script src="js/api.js"></script>
  <script src="js/layout.js"></script>
  <script>
    Auth.exigirLogin();
    Auth.exibirNome();

    async function carregar() {
      const emprestimos = await get('/emprestimos/meus');
      if (!emprestimos || emprestimos.status) return;

      const pendentes = emprestimos.filter(e => e.status === 'PENDENTE');
      const ativos    = emprestimos.filter(e => e.status === 'APROVADO');

      renderPendentes(pendentes);
      renderAtivos(ativos);
    }

    function renderPendentes(lista) {
      const el = document.getElementById('lista-pendentes');
      if (!lista.length) { el.innerHTML = '<p class="sem-dados">Nenhuma solicitação pendente.</p>'; return; }
      el.innerHTML = lista.map(e => `
        <div class="item-livro">
          <div class="capa-placeholder" style="width:80px;height:110px;flex-shrink:0">Capa</div>
          <div class="detalhes-livro">
            <h3 class="titulo-livro">Protocolo #${e.id}</h3>
            <p>Solicitado em: ${formatarData(e.dataCriacao)}</p>
            <div class="acoes-livro">
              <p class="status-livro">STATUS: <span class="badge-pendente">Pendente</span></p>
            </div>
          </div>
        </div>
      `).join('');
    }

    function renderAtivos(lista) {
      const el = document.getElementById('lista-ativas');
      if (!lista.length) { el.innerHTML = '<p class="sem-dados">Nenhuma reserva ativa.</p>'; return; }
      el.innerHTML = lista.map(e => `
        <div class="item-livro">
          <div class="capa-placeholder" style="width:80px;height:110px;flex-shrink:0">Capa</div>
          <div class="detalhes-livro">
            <h3 class="titulo-livro">Protocolo #${e.id}</h3>
            <p>Aprovado em: ${formatarData(e.dataCriacao)}</p>
            <div class="acoes-livro">
              <p class="status-livro">STATUS: <span class="badge-ativa">Ativa</span></p>
            </div>
          </div>
        </div>
      `).join('');
    }

    function formatarData(iso) {
      if (!iso) return '-';
      return new Date(iso).toLocaleDateString('pt-BR');
    }

    carregar();
  </script>
</body>
</html>
