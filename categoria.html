<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Categoria | Ler e Educar</title>
  <link rel="stylesheet" href="css/design-system.css"><link rel="stylesheet" href="css/layout.css">
  <style>
    .page-content{padding:24px 40px 60px;max-width:1440px;margin:0 auto;}
    .page-back{display:inline-flex;align-items:center;gap:6px;color:var(--text-muted);font-size:.85rem;text-decoration:none;margin-bottom:20px;transition:color .2s;}
    .page-back:hover{color:var(--primary-dark);}
    .page-title{font-family:var(--font-display);font-size:1.6rem;font-weight:700;color:var(--text-dark);margin-bottom:4px;}
    .page-sub{font-size:.88rem;color:var(--text-muted);margin-bottom:24px;}
    .series-filter{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:28px;}
    .chip{padding:6px 16px;border-radius:50px;border:1.5px solid var(--beige);background:white;color:var(--text-mid);font-family:var(--font-body);font-size:.78rem;font-weight:500;cursor:pointer;transition:all .2s;}
    .chip:hover,.chip.ativo{background:var(--primary-dark);border-color:var(--primary-dark);color:white;}
    .livros-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:16px;}
    .livro-card{background:white;border-radius:var(--radius-lg);padding:14px;border:1px solid rgba(155,123,93,.1);box-shadow:var(--shadow-sm);cursor:pointer;position:relative;overflow:hidden;transition:transform .3s var(--ease-bounce),box-shadow .3s;animation:fadeUp .4s both;}
    .livro-card:hover{transform:translateY(-7px) scale(1.02);box-shadow:var(--shadow-md);}
    .capa-livro-box{width:100%;height:165px;background:var(--bg-warm);border-radius:var(--radius-md);overflow:hidden;margin-bottom:10px;display:flex;align-items:center;justify-content:center;font-size:.72rem;color:var(--text-muted);}
    .capa-livro-box img{width:100%;height:100%;object-fit:cover;}
    .sk{background:linear-gradient(90deg,var(--bg-warm) 25%,var(--beige) 50%,var(--bg-warm) 75%);background-size:200% 100%;animation:skeleton 1.4s infinite;}
    .livro-card h3{font-family:var(--font-display);font-size:.85rem;color:var(--text-dark);line-height:1.3;margin-bottom:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
    .livro-card .autor{font-size:.73rem;color:var(--text-muted);margin-bottom:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .badge-d{display:inline-block;padding:2px 8px;border-radius:50px;font-size:.68rem;font-weight:700;background:rgba(39,174,96,.1);color:#1a7a40;border:1px solid rgba(39,174,96,.2);}
    .badge-i{display:inline-block;padding:2px 8px;border-radius:50px;font-size:.68rem;font-weight:700;background:rgba(231,76,60,.08);color:#b03228;border:1px solid rgba(231,76,60,.15);}
    .modal{position:fixed;inset:0;background:rgba(61,43,31,.5);backdrop-filter:blur(8px);z-index:2000;display:flex;align-items:center;justify-content:center;padding:20px;animation:fadeIn .2s both;}
    .modal-box{background:white;border-radius:var(--radius-xl);padding:36px;max-width:680px;width:100%;max-height:90vh;overflow-y:auto;box-shadow:var(--shadow-lg);position:relative;animation:fadeUp .35s var(--ease-bounce) both;}
    .modal-close{position:absolute;top:16px;right:18px;width:32px;height:32px;border-radius:50%;background:var(--bg-warm);border:none;font-size:.9rem;cursor:pointer;transition:all .2s;}
    .modal-close:hover{background:var(--beige);transform:rotate(90deg);}
    .modal-layout{display:flex;gap:24px;}
    .modal-capa{width:170px;height:240px;border-radius:var(--radius-md);overflow:hidden;background:var(--bg-warm);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:2rem;}
    .modal-capa img{width:100%;height:100%;object-fit:cover;}
    .modal-titulo{font-family:var(--font-display);font-size:1.25rem;font-weight:700;color:var(--text-dark);margin-bottom:12px;line-height:1.3;}
    .modal-row{font-size:.88rem;color:var(--text-mid);margin-bottom:7px;}
    .modal-row strong{color:var(--text-dark);}
    .serie-badge{display:inline-block;padding:3px 10px;border-radius:50px;background:var(--beige);color:var(--text-mid);font-size:.72rem;font-weight:600;margin:2px;}
    .modal-select{width:100%;padding:10px 14px;border:1.5px solid var(--beige);border-radius:var(--radius-md);font-family:var(--font-body);font-size:.9rem;color:var(--text-dark);background:white;outline:none;margin-bottom:10px;transition:border-color .2s;}
    .modal-select:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(155,123,93,.15);}
    .qty-stepper{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
    .qty-btn{width:32px;height:32px;border-radius:50%;border:1.5px solid var(--beige);background:white;font-size:1rem;cursor:pointer;display:flex;align-items:center;justify-content:center;font-weight:700;transition:all .2s;}
    .qty-btn:hover{background:var(--beige);}
    .qty-val{font-family:var(--font-display);font-size:1.1rem;font-weight:700;min-width:28px;text-align:center;}
    .btn-res{width:100%;padding:12px;background:var(--primary-dark);color:white;border:none;border-radius:50px;font-family:var(--font-body);font-size:.9rem;font-weight:700;cursor:pointer;transition:all .25s;}
    .btn-res:hover{background:var(--primary-darker);transform:translateY(-2px);box-shadow:var(--shadow-md);}
    .fb{padding:10px 14px;border-radius:var(--radius-md);margin-top:10px;font-size:.88rem;display:none;}
    .fb.ok{background:rgba(39,174,96,.1);color:#1a7a40;border:1px solid rgba(39,174,96,.2);}
    .fb.err{background:rgba(231,76,60,.1);color:#b03228;border:1px solid rgba(231,76,60,.2);}
    .empty{text-align:center;padding:60px 20px;color:var(--text-muted);}
    @media(max-width:768px){.page-content{padding:16px 20px;}.modal-layout{flex-direction:column;}.modal-capa{width:100%;height:180px;}}
  </style>
</head>
<body>
  <nav id="menu-lateral" class="menu-lateral">
    <div class="fechar-menu" onclick="toggleMenu()">✕</div>
    <a href="catalogo.html"       class="menu-item ativo">CATÁLOGO</a>
    <a href="perfil-usuario.html" class="menu-item">MEU PERFIL</a>
    <a href="reservas.html"       class="menu-item">MINHAS RESERVAS</a>
    <a href="devolutivas.html"    class="menu-item">DEVOLUÇÕES</a>
  </nav>
  <header class="header">
    <div class="menu-hamburguer" onclick="toggleMenu()"><span></span><span></span><span></span></div>
    <div class="logo-header"><img src="img/logo-capa-e-barra-de-pesquisa.png" alt="Logo" class="logo-img"><span class="logo-text">LER E EDUCAR</span></div>
    <input type="text" id="busca" placeholder="🔍 Buscar livro..." class="busca" oninput="filtrarTexto()">
    <div class="header-direita"><div class="usuario">Olá, <span id="nome-usuario-logado">Gestor</span></div><a href="#" class="sair" onclick="Auth.logout()">SAIR</a></div>
  </header>

  <div class="page-content">
    <a href="catalogo.html" class="page-back">← Voltar ao catálogo</a>
    <h1 class="page-title" id="page-title">Carregando...</h1>
    <p class="page-sub" id="page-sub"></p>
    <div class="series-filter">
      <button class="chip ativo" onclick="filtrarSerie(null,this)">Todas as séries</button>
      <button class="chip" onclick="filtrarSerie('PRIMEIRO_ANO',this)">1º Ano</button>
      <button class="chip" onclick="filtrarSerie('SEGUNDO_ANO',this)">2º Ano</button>
      <button class="chip" onclick="filtrarSerie('TERCEIRO_ANO',this)">3º Ano</button>
      <button class="chip" onclick="filtrarSerie('QUARTO_ANO',this)">4º Ano</button>
      <button class="chip" onclick="filtrarSerie('QUINTO_ANO',this)">5º Ano</button>
    </div>
    <div class="livros-grid" id="grid"><p class="empty">Carregando...</p></div>
  </div>

  <div id="modal-livro" class="modal" style="display:none">
    <div class="modal-box">
      <button class="modal-close" onclick="fecharModal()">✕</button>
      <div class="modal-layout">
        <div class="modal-capa" id="m-capa">📖</div>
        <div>
          <h2 class="modal-titulo" id="m-titulo"></h2>
          <p class="modal-row"><strong>Autor:</strong> <span id="m-autor"></span></p>
          <p class="modal-row"><strong>Disponíveis:</strong> <span id="m-disp"></span></p>
          <div id="m-series" style="margin:8px 0 14px;"></div>
          <label style="font-size:.72rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--text-muted);display:block;margin-bottom:5px">Série de destino</label>
          <select id="m-serie" class="modal-select">
            <option value="">Selecione</option>
            <option value="PRIMEIRO_ANO">1º Ano</option><option value="SEGUNDO_ANO">2º Ano</option>
            <option value="TERCEIRO_ANO">3º Ano</option><option value="QUARTO_ANO">4º Ano</option><option value="QUINTO_ANO">5º Ano</option>
          </select>
          <div class="qty-stepper">
            <button class="qty-btn" onclick="aqtd(-1)">−</button>
            <span class="qty-val" id="m-qtd">1</span>
            <button class="qty-btn" onclick="aqtd(1)">+</button>
          </div>
          <button class="btn-res" onclick="solicitar()">Solicitar reserva</button>
          <div class="fb" id="m-fb"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script><script src="js/layout.js"></script><script src="js/animations.js"></script>
  <script>
    Auth.exigirLogin(); Auth.exibirNome(); initAnimations({ tilt:false });
    const ICONS = { ALFABETIZACAO_LETRAMENTO:'🔤',CIENCIAS_NATUREZA:'🌿',FABULAS:'🦊',CONTOS_DE_FADAS:'🏰',HISTORIA_CULTURA:'🌍',MATEMATICA:'🔢',OUTRO:'📖' };
    const params = new URLSearchParams(location.search);
    const catKey = params.get('cat') || 'FABULAS';
    let todos=[], serieAtiva=null, livroAtual=null, qtdAtual=1;
    document.getElementById('page-title').textContent = (ICONS[catKey]||'📖') + ' ' + (CATEGORIAS[catKey]||catKey);

    async function carregar() {
      const livros = await get('/livros?categoria=' + catKey);
      if (!livros||livros.status) return;
      todos = livros;
      document.getElementById('page-sub').textContent = livros.length + ' livro(s) nesta categoria';
      renderizar(livros);
    }
    function filtrarSerie(s, btn) { serieAtiva=s; document.querySelectorAll('.chip').forEach(c=>c.classList.remove('ativo')); btn.classList.add('ativo'); renderizar(filtrar(todos)); }
    function filtrarTexto() { const q=document.getElementById('busca').value.toLowerCase(); renderizar(filtrar(todos).filter(l=>l.titulo.toLowerCase().includes(q)||l.autor.toLowerCase().includes(q))); }
    function filtrar(lista) { return serieAtiva ? lista.filter(l=>(l.seriesIndicadas||[]).includes(serieAtiva)) : lista; }
    function renderizar(livros) {
      const grid=document.getElementById('grid');
      if (!livros.length) { grid.innerHTML='<p class="empty">Nenhum livro encontrado.</p>'; return; }
      grid.innerHTML = livros.map((l,i)=>`
        <div class="livro-card" onclick='abrirModal(${JSON.stringify(l).replace(/'/g,"&#39;")})' style="animation-delay:${i*.05}s">
          <div class="capa-livro-box sk" id="capa-${l.id}"></div>
          <h3>${l.titulo}</h3><p class="autor">${l.autor}</p>
          <span class="${l.totalDisponiveis>0?'badge-d':'badge-i'}">${l.totalDisponiveis>0?l.totalDisponiveis+' disponíveis':'Indisponível'}</span>
        </div>`).join('');
      livros.forEach(l => buscarCapa(l).then(url=>{const el=document.getElementById('capa-'+l.id);if(el){el.classList.remove('sk');el.innerHTML=url?`<img src="${url}">`:'📖';}}));
    }
    function abrirModal(l) {
      livroAtual=l; qtdAtual=1;
      document.getElementById('m-titulo').textContent=l.titulo; document.getElementById('m-autor').textContent=l.autor;
      document.getElementById('m-disp').textContent=l.totalDisponiveis; document.getElementById('m-qtd').textContent=1;
      document.getElementById('m-serie').value=''; document.getElementById('m-fb').style.display='none';
      document.getElementById('m-series').innerHTML=(l.seriesIndicadas||[]).map(s=>`<span class="serie-badge">${SERIES[s]||s}</span>`).join('');
      document.getElementById('m-capa').innerHTML='⏳'; document.getElementById('modal-livro').style.display='flex';
      buscarCapa(l).then(url=>{const el=document.getElementById('m-capa');if(el)el.innerHTML=url?`<img src="${url}">`:'📖';});
    }
    function fecharModal(){document.getElementById('modal-livro').style.display='none';}
    function aqtd(d){qtdAtual=Math.max(1,qtdAtual+d);document.getElementById('m-qtd').textContent=qtdAtual;}
    async function solicitar() {
      const serie=document.getElementById('m-serie').value;
      if(!serie){fb('Selecione a série.',false);return;}
      const res=await post('/emprestimos',{itens:[{idLivro:livroAtual.id,serie,quantidade:qtdAtual}]});
      if(res&&res.id){fb('✓ Reserva solicitada!',true);setTimeout(fecharModal,1400);}
      else fb(res?.mensagens?.[0]||'Erro.',false);
    }
    function fb(msg,ok){const el=document.getElementById('m-fb');el.textContent=msg;el.className='fb '+(ok?'ok':'err');el.style.display='block';}
    document.getElementById('modal-livro').addEventListener('click',e=>{if(e.target===e.currentTarget)fecharModal();});
    carregar();
  </script>
</body></html>
